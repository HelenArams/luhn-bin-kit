run:
  timeout: 3m

linters:
  enable:
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
  goimports:
    local-prefixes: github.com/HelenArams/luhn-bin-kit
  nolintlint:
    require-explanation: true
    require-specific: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
