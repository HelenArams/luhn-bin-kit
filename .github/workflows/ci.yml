name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzValid -fuzztime=20s ./luhn
          go test -run='^$' -fuzz=FuzzMask -fuzztime=20s ./mask

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56.2
